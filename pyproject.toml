[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "release-check"
version = "1.0.0"
description = "List Deezer releases by artists in your Navidrome library that you do not own"
requires-python = ">=3.10"
# No runtime dependencies: the standard library covers HTTP, JSON and SQLite,
# and urllib surfaces the socket/TLS errors needed for useful diagnostics.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
release-check = "release_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
